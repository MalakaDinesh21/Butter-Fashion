<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butter Fashion Admin Login</title>
    <link rel="icon" href="images/Butter_logo.png" type="image/png">
<link rel="shortcut icon" href="images/Butter_logo.png" type="image/png">
<link rel="apple-touch-icon" href="images/Butter_logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-card">

        <div class="brand center">
            <img src="images/Butter_logo.png" alt="Butter Fashion Logo">
        </div>

        <p class="eyebrow">Admin Panel</p>
        <h2>Butter Fashion Dashboard</h2>
        <p style="color:#6f6f6f;">
            Hint <b>Username: admin</b>, <b>Password: admin123</b>
        </p>

        <form id="loginForm" class="form-card" style="border:none;box-shadow:none;padding:0;">
            
            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit" class="btn dark full">
                Login
            </button>

        </form>

        <p id="errorMsg" style="color:red;font-size:14px;"></p>

    </div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if(username === "admin" && password === "admin123"){

        localStorage.setItem("adminLoggedIn","true");

        window.location.href = "dashboard.html";

    }else{

        document.getElementById("errorMsg").textContent =
        "Invalid Username or Password";

    }

});

</script>

</body>
</html>
